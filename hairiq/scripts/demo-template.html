<title>How Is My Hair — live demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* Pacifico (wordmark) — embedded at build time so the single-file demo
     needs no network; scripts/pacifico-latin.woff2 is the source. */
  @font-face {
    font-family: "Pacifico";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url(data:font/woff2;base64,__PACIFICO_B64__) format("woff2");
  }
  :root {
    /* saturated "groovy" palette (spec §3, July 12) — names historical */
    --cream: #ffb4d5;
    --coral: #ff8d61;
    --coral-deep: #c2410c;
    --blush: #ffa1cb;
    --blush-deep: #ff61a3;
    --butter: #ffdb61;
    --mint: #c8e6c9;
    --mint-deep: #386641;
    /* near-black dark brown text for the pink bg (rev 7): 9.9:1 / 7.3:1 */
    --cocoa: #2e1c15;
    --cocoa-soft: #4d2f24;
    --shadow-soft: 0 10px 26px -10px rgb(194 65 12 / 0.5);
    --shadow-card: 0 6px 22px -10px rgb(46 28 21 / 0.18);
    --display: "Quicksand", "Poppins", ui-rounded, "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    --body: "Nunito", ui-rounded, "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    --title: "Pacifico", "Brush Script MT", "Segoe Script", cursive;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--cream); }
  body {
    background: var(--cream);
    color: var(--cocoa);
    font-family: var(--body);
    font-weight: 600;
    line-height: 1.55;
    min-height: 100dvh;
  }
  #app { min-height: 100dvh; }
  h1, h2, h3, .display { font-family: var(--display); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; border-radius: 0.5rem; }

  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise 0.35s ease both; }
  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; }
    * { transition: none !important; }
  }

  .col { width: 100%; max-width: 42rem; margin: 0 auto; padding: 0 1.5rem; }

  /* buttons */
  .pill {
    display: inline-block;
    border-radius: 999px;
    background: var(--coral);
    color: var(--cocoa);
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.15rem;
    padding: 1.1rem 2.5rem;
    box-shadow: var(--shadow-soft);
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  .pill:hover { background: var(--coral-deep); color: var(--cream); }
  .pill:active { transform: scale(0.96); }
  .pill[disabled] { background: rgb(255 161 203 / 0.5); color: rgb(77 47 36 / 0.65); box-shadow: none; cursor: not-allowed; }
  .ghost {
    border-radius: 999px;
    padding: 1rem 1.5rem;
    font-family: var(--display);
    font-weight: 700;
    color: var(--cocoa-soft);
  }
  .ghost:hover { background: rgb(255 161 203 / 0.4); }

  /* landing — soft blurred pink↔orange gradient (rev 7) */
  .landing {
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; position: relative; overflow: hidden; padding: 1.5rem;
    background:
      radial-gradient(90% 70% at 15% 0%, #ff61a3 0%, rgb(255 97 163 / 0) 60%),
      radial-gradient(80% 65% at 100% 30%, #ff8d61 0%, rgb(255 141 97 / 0) 62%),
      radial-gradient(95% 80% at 40% 110%, #ffab74 0%, rgb(255 171 116 / 0) 65%),
      linear-gradient(160deg, #ffb4d5 0%, #ffc4b8 55%, #ffb4d5 100%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(64px); pointer-events: none; }
  .logo {
    width: 6rem; height: 6rem; border-radius: 50%;
    box-shadow: var(--shadow-soft); margin: 0 auto 1.5rem;
  }
  .logo img { display: block; width: 100%; height: 100%; border-radius: 50%; }
  .landing h1 { font-family: var(--title); font-weight: 400; font-size: clamp(2.3rem, 9vw, 3.4rem); line-height: 1.35; text-wrap: balance; }
  .landing h1 span { color: var(--coral-deep); }
  .tagline { margin-top: 1rem; font-size: 1.1rem; color: var(--cocoa-soft); max-width: 26rem; }
  .fineprint { margin-top: 1.2rem; font-size: 0.85rem; color: rgb(77 47 36 / 0.85); }
  /* 🌐 Español toggle — absolute (not fixed) so it scrolls away instead of
     colliding with the sticky tabs, same as the app */
  #lang-toggle {
    position: absolute; top: 0.75rem; right: 0.75rem; z-index: 50;
    display: inline-flex; align-items: center; gap: 0.4rem; min-height: 2.75rem;
    border: 2px solid rgb(255 97 163 / 0.6); border-radius: 999px;
    background: rgb(255 255 255 / 0.95); padding: 0.5rem 1rem;
    font-family: var(--display); font-weight: 700; font-size: 0.9rem; color: var(--cocoa);
    box-shadow: var(--shadow-card); cursor: pointer;
  }
  #lang-toggle:hover { border-color: var(--coral-deep); }
  .also { margin-top: 0.6rem; text-align: center; font-size: 0.85rem; font-weight: 800; color: var(--coral-deep); }
  .paywall-note.hot { color: var(--coral-deep); font-weight: 800; }

  /* quiz */
  .quiz { display: flex; flex-direction: column; min-height: 100dvh; padding-top: 2rem; padding-bottom: 2.5rem; }
  .progress-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
  .progress-meta .label { font-family: var(--display); font-weight: 700; font-size: 0.85rem; color: var(--cocoa-soft); }
  .progress-meta .pct { font-size: 0.75rem; font-weight: 700; color: rgb(138 107 96 / 0.7); }
  .track { height: 0.75rem; border-radius: 999px; background: rgb(255 161 203 / 0.5); overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--blush-deep), var(--coral)); transition: width 0.4s ease; }
  .quiz h1 { font-size: 1.9rem; line-height: 1.2; margin-top: 2rem; }
  .subtitle { margin-top: 0.5rem; color: var(--cocoa-soft); }
  .answers { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem; flex: 1; }
  .answer {
    display: flex; align-items: center; gap: 1rem; text-align: left; width: 100%;
    background: rgb(255 255 255 / 0.9); border: 2px solid transparent; border-radius: 1.5rem;
    padding: 1.15rem 1.25rem; box-shadow: var(--shadow-card);
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .answer:hover { border-color: rgb(255 97 163 / 0.6); }
  .answer:active { transform: scale(0.98); }
  .answer.selected { border-color: var(--coral-deep); background: rgb(255 161 203 / 0.4); }
  .answer .emoji { font-size: 1.5rem; }
  .answer .lab { flex: 1; }
  .answer .lab b { display: block; font-family: var(--display); font-size: 1.05rem; }
  .answer .lab small { display: block; color: var(--cocoa-soft); font-size: 0.85rem; }
  .answer .tick {
    width: 1.7rem; height: 1.7rem; flex: none; display: flex; align-items: center; justify-content: center;
    border: 2px solid rgb(255 97 163 / 0.5); background: #fff; font-size: 0.8rem; font-weight: 900;
  }
  .answer .tick.round { border-radius: 50%; }
  .answer .tick.square { border-radius: 0.5rem; }
  .answer.selected .tick { border-color: var(--coral-deep); background: var(--coral); }
  .quiz nav { display: flex; gap: 0.75rem; align-items: center; margin-top: 2rem; }
  .quiz nav .pill { flex: 1; padding: 1rem 2rem; }

  /* results */
  .results { padding-top: 2.5rem; padding-bottom: 4rem; }
  .eyebrow { text-align: center; font-family: var(--display); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--coral-deep); }
  .results > .col > h1, .results h1 { text-align: center; font-size: 2.3rem; line-height: 1.15; margin-top: 0.5rem; text-wrap: balance; }
  .results .blurb { text-align: center; color: var(--cocoa-soft); max-width: 32rem; margin: 0.8rem auto 0; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 1.25rem; list-style: none; }
  .chips li { background: var(--butter); color: var(--cocoa); border-radius: 999px; padding: 0.35rem 0.9rem; font-size: 0.78rem; font-weight: 800; box-shadow: var(--shadow-card); }
  .tabs-wrap { position: sticky; top: 0; z-index: 10; background: rgb(255 180 213 / 0.95); backdrop-filter: blur(4px); padding: 0.75rem 0; margin-top: 2rem; }
  .tabs { display: flex; gap: 0.4rem; background: #fff; border: 1px solid rgb(255 97 163 / 0.3); border-radius: 999px; padding: 0.4rem; box-shadow: var(--shadow-card); }
  .tab {
    flex: 1; min-height: 2.75rem; white-space: nowrap; border-radius: 999px; padding: 0.6rem 0.25rem; text-align: center;
    font-family: var(--display); font-weight: 700; font-size: 13px; line-height: 1.2; color: var(--cocoa-soft);
    transition: background 0.15s ease, color 0.15s ease;
  }
  @media (min-width: 640px) { .tab { font-size: 0.95rem; padding: 0.6rem 0.5rem; } }
  @media (max-width: 639px) { .tab .tab-emoji, .subtab .tab-emoji { display: none; } }
  .tab:hover { background: rgb(255 161 203 / 0.4); }
  .tab.active { background: var(--coral); color: var(--cocoa); box-shadow: var(--shadow-soft); }
  .subtabs { display: flex; gap: 0.35rem; margin-top: 0.6rem; }
  .subtab {
    flex: 1; min-height: 2.75rem; white-space: nowrap; border-radius: 999px; padding: 0.45rem 0.25rem;
    font-family: var(--display); font-weight: 700; font-size: 13px; line-height: 1.2;
    color: var(--cocoa-soft); background: rgb(255 255 255 / 0.8); transition: background 0.15s ease, color 0.15s ease;
  }
  .subtab:hover { background: rgb(255 161 203 / 0.4); }
  .subtab.active { background: var(--cocoa); color: var(--cream); box-shadow: var(--shadow-card); }
  .cf-note { text-align: center; font-size: 0.78rem; color: var(--cocoa-soft); margin-top: 0.6rem; }
  .phase { margin-top: 2.5rem; }
  .phase h2 { font-size: 1.6rem; }
  .phase .intro { margin-top: 0.4rem; font-size: 0.92rem; color: var(--cocoa-soft); }
  .steps { list-style: none; display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
  .step { background: rgb(255 255 255 / 0.7); border-radius: 1.5rem; padding: 1.35rem; box-shadow: var(--shadow-card); }
  .step-head { display: flex; gap: 1rem; align-items: flex-start; }
  .step-num {
    width: 2.2rem; height: 2.2rem; flex: none; border-radius: 50%; background: var(--blush);
    display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700;
  }
  .step h3 { font-size: 1.12rem; line-height: 1.3; display: inline; }
  .optional { font-size: 0.85rem; color: rgb(138 107 96 / 0.8); font-weight: 700; }
  .freq {
    display: inline-block; vertical-align: middle; margin-left: 0.6rem; padding: 0.1rem 0.6rem;
    border: 1px solid rgb(255 97 163 / 0.4); background: #fff; border-radius: 999px;
    font-size: 0.68rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--cocoa-soft);
  }
  .how { margin-top: 0.5rem; font-size: 0.94rem; color: var(--cocoa-soft); }
  .prods { display: grid; gap: 0.75rem; margin-top: 1rem; }
  @media (min-width: 600px) { .prods { grid-template-columns: 1fr 1fr; } }
  .prod { background: rgb(255 255 255 / 0.95); border-radius: 1rem; padding: 1rem; box-shadow: var(--shadow-card); }
  .prod-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
  .brand { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cocoa-soft); }
  .badges { display: flex; gap: 0.35rem; flex: none; }
  .badge { border-radius: 999px; padding: 0.12rem 0.6rem; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge.mint { background: var(--mint); color: var(--mint-deep); }
  .badge.butter { background: var(--butter); color: var(--cocoa); }
  .prod-name { font-family: var(--display); font-weight: 700; margin-top: 0.25rem; line-height: 1.3; }
  .prod-blurb { margin-top: 0.35rem; font-size: 0.85rem; color: var(--cocoa-soft); }
  .prod-cf { margin-top: 0.5rem; font-size: 0.76rem; font-style: italic; color: var(--mint-deep); }
  .empty { margin-top: 1rem; border: 2px dashed rgb(255 97 163 / 0.4); border-radius: 1rem; padding: 1rem; font-size: 0.88rem; color: var(--cocoa-soft); }
  .variants { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
  .variant { border: 2px solid rgb(255 161 203 / 0.8); border-radius: 1rem; padding: 1rem; }
  .variant.primary { border-color: rgb(230 81 0 / 0.8); }
  .variant-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  .variant-head b { font-family: var(--display); font-size: 0.92rem; }
  .vtag { border-radius: 999px; padding: 0.12rem 0.6rem; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; background: rgb(255 161 203 / 0.6); color: var(--cocoa-soft); }
  .vtag.hot { background: var(--coral); color: var(--cocoa); }
  details.principle { margin-top: 1rem; background: rgb(255 161 203 / 0.25); border-radius: 1rem; padding: 0.8rem 1rem; }
  details.principle summary { cursor: pointer; list-style: none; display: flex; align-items: center; min-height: 2.75rem; font-family: var(--display); font-weight: 700; font-size: 0.9rem; color: var(--coral-deep); }
  details.principle summary::-webkit-details-marker { display: none; }
  details.principle summary::after { content: "▾"; display: inline-block; margin-left: 0.35rem; transition: transform 0.2s ease; }
  details.principle[open] summary::after { transform: rotate(180deg); }
  .principle-body { margin-top: 0.7rem; display: flex; flex-direction: column; gap: 0.6rem; font-size: 0.88rem; }
  .principle-body ol { padding-left: 1.3rem; display: flex; flex-direction: column; gap: 0.4rem; }
  .choices { display: grid; gap: 0.5rem; }
  @media (min-width: 600px) { .choices { grid-template-columns: 1fr 1fr; } }
  .choice { background: rgb(255 255 255 / 0.8); border-radius: 0.8rem; padding: 0.8rem; }
  .choice b { font-family: var(--display); color: var(--coral-deep); }
  .notes { margin-top: 3rem; }
  .notes h2 { font-size: 1.6rem; }
  .note { border-left: 4px solid var(--coral); background: rgb(255 255 255 / 0.7); border-radius: 1.5rem; padding: 1.25rem; box-shadow: var(--shadow-card); margin-top: 1rem; }
  .note h3 { font-size: 1rem; }
  .note p { margin-top: 0.5rem; font-size: 0.88rem; color: var(--cocoa-soft); }
  .actions { display: flex; flex-direction: column; align-items: center; gap: 0.9rem; margin-top: 3rem; }
  .save-wrap { position: relative; width: 100%; max-width: 22rem; }
  .save-wrap .pill { width: 100%; }
  .soon { position: absolute; top: -0.7rem; right: 1rem; background: var(--butter); border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; box-shadow: var(--shadow-card); }
  .paywall-note { max-width: 22rem; text-align: center; font-size: 0.78rem; color: var(--cocoa-soft); }
  .actions .retake { width: 100%; max-width: 22rem; }
  .signup { margin-top: 3rem; background: rgb(255 161 203 / 0.3); border-radius: 1.5rem; padding: 1.5rem; }
  .signup h2 { font-size: 1.25rem; }
  .tier-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
  .tier-chip { min-height: 2.75rem; border: 2px solid rgb(255 97 163 / 0.4); background: #fff; color: var(--cocoa-soft); border-radius: 999px; padding: 0.5rem 1rem; font-family: var(--display); font-weight: 700; font-size: 0.85rem; transition: all 0.15s ease; }
  .tier-chip:hover { border-color: var(--coral); }
  .tier-chip.on { border-color: var(--coral-deep); background: var(--coral); color: var(--cocoa); }
  .signup-fields { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
  .signup-fields input { flex: 1 1 12rem; border: 2px solid rgb(255 97 163 / 0.4); border-radius: 999px; background: #fff; padding: 0.75rem 1.25rem; font: inherit; font-size: 0.9rem; color: var(--cocoa); }
  .signup-fields input:focus { border-color: var(--coral-deep); outline: none; }
  .signup-error { margin-top: 0.5rem; font-size: 0.88rem; font-weight: 800; color: var(--coral-deep); }
  .signup-btn { margin-top: 1rem; padding: 0.85rem 2rem; font-size: 1rem; }
  footer { margin-top: 2.5rem; border-top: 1px solid rgb(255 161 203 / 0.7); padding-top: 1.5rem; text-align: center; font-size: 0.78rem; color: var(--cocoa-soft); }
</style>

<button id="lang-toggle" type="button" aria-label="Traducir al español">🌐 <span>Español</span></button>
<div id="app"></div>

<script>
/*__HAIRIQ_DATA__*/

// ---------------------------------------------------------------------------
// Demo shell — same screens & flow as the Next.js app (landing → quiz → results)
// ---------------------------------------------------------------------------
const app = document.getElementById("app");
const state = {
  screen: "landing", idx: 0, answers: {}, tier: null, routine: null,
  signupTiers: [], signupEmail: "", signupZip: "", signupError: "", signedUp: false,
  phase: "washDay", lang: "en", unlockClicked: false,
};
try { if (localStorage.getItem("himh-demo-lang") === "es") state.lang = "es"; } catch {}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// 🌐 Español (rev 8): the artifact sandbox can't load Google Translate, so
// the demo carries its own translations — lib/i18n-es.js maps every exact
// English string to Spanish. Unmatched strings (product blurbs, brand
// names) fall back to English on purpose.
function t(s) {
  if (state.lang !== "es" || !s) return s;
  const hit = ES[s];
  if (hit) return hit;
  // composed summary chips: "Oily + Flaky scalp", "Grow it longer + Repair damage"
  const scalpChip = s.match(/^(.+) scalp$/);
  if (scalpChip) {
    const parts = scalpChip[1].split(" + ").map((x) => (ES[x] || x).toLowerCase());
    return "Cuero cabelludo " + parts.join(" + ");
  }
  if (s.includes(" + ")) return s.split(" + ").map((x) => t(x)).join(" + ");
  return s;
}

const langBtn = document.getElementById("lang-toggle");
function syncLangBtn() {
  langBtn.querySelector("span").textContent = state.lang === "es" ? "English" : "Español";
  langBtn.setAttribute("aria-label", state.lang === "es" ? "Switch to English" : "Traducir al español");
}
langBtn.addEventListener("click", () => {
  state.lang = state.lang === "es" ? "en" : "es";
  try { localStorage.setItem("himh-demo-lang", state.lang); } catch {}
  readSignupFields();
  syncLangBtn();
  render();
});
syncLangBtn();

function renderLanding() {
  return `
  <main class="landing">
    <div class="blob" style="width:18rem;height:18rem;top:-6rem;left:-6rem;background:var(--blush);opacity:.6"></div>
    <div class="blob" style="width:20rem;height:20rem;top:33%;right:-7rem;background:var(--coral);opacity:.3"></div>
    <div class="blob" style="width:18rem;height:18rem;bottom:-8rem;left:25%;background:var(--blush);opacity:.5"></div>
    <div class="rise" style="position:relative;max-width:28rem">
      <!-- circular logo — same artwork as public/logo.webp in the app;
           scripts/logo-demo.webp is embedded here at build time -->
      <div class="logo" aria-hidden="true">
        <img alt="" src="data:image/webp;base64,__LOGO_B64__" />
      </div>
      <h1 class="wordmark">How Is My <span>Hair</span></h1>
      <p class="tagline">${esc(t("Eleven quick questions. One personalized hair routine — with picks for every budget."))}</p>
      <div style="margin-top:2.2rem"><button class="pill" data-action="start">${esc(t("Take the Quiz"))}</button></div>
      <p class="fineprint">${esc(t("≈ 2 minutes · no account needed"))}</p>
    </div>
  </main>`;
}

function renderQuiz() {
  const q = QUESTIONS[state.idx];
  const value = state.answers[q.id];
  const answered = isAnswered(state.answers, q);
  const isLast = state.idx === QUESTIONS.length - 1;
  const pct = Math.round(((state.idx + 1) / QUESTIONS.length) * 100);

  const cards = q.options
    .map((o) => {
      const selected = q.multiSelect ? Array.isArray(value) && value.includes(o.value) : value === o.value;
      return `
      <button class="answer${selected ? " selected" : ""}" aria-pressed="${selected}" data-action="pick" data-value="${esc(o.value)}">
        <span class="emoji" aria-hidden="true">${o.emoji || ""}</span>
        <span class="lab"><b>${esc(t(o.label))}</b>${o.sublabel ? `<small>${esc(t(o.sublabel))}</small>` : ""}</span>
        <span class="tick ${q.multiSelect ? "square" : "round"}" aria-hidden="true">${selected ? "✓" : ""}</span>
      </button>`;
    })
    .join("");

  return `
  <main class="quiz col">
    <div>
      <div class="progress-meta">
        <span class="label">${state.lang === "es" ? `Pregunta ${state.idx + 1} de ${QUESTIONS.length}` : `Question ${state.idx + 1} of ${QUESTIONS.length}`}</span>
        <span class="pct">${pct}%</span>
      </div>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${QUESTIONS.length}" aria-valuenow="${state.idx + 1}">
        <div class="fill" style="width:${pct}%"></div>
      </div>
    </div>
    <div class="rise" style="flex:1;display:flex;flex-direction:column">
      <h1>${esc(t(q.title))}</h1>
      ${q.subtitle ? `<p class="subtitle">${esc(t(q.subtitle))}</p>` : ""}
      <div class="answers" role="group" aria-label="${esc(t(q.title))}">${cards}</div>
    </div>
    <nav>
      <button class="ghost" data-action="back">${esc(t("← Back"))}</button>
      <button class="pill" data-action="next" ${answered ? "" : "disabled"}>${esc(t(isLast ? "See my results ✨" : "Next"))}</button>
    </nav>
  </main>`;
}

function productCard(p, tier) {
  const badges =
    (p.tags && p.tags.includes("new") ? `<span class="badge butter">${esc(t("New"))}</span>` : "") +
    (p.crueltyFree ? `<span class="badge mint">${esc(t("Cruelty-Free"))}</span>` : "");
  return `
  <div class="prod">
    <div class="prod-top"><span class="brand">${esc(p.brand)}</span><span class="badges">${badges}</span></div>
    <div class="prod-name">${esc(p.name)}</div>
    ${p.blurb ? `<div class="prod-blurb">${esc(p.blurb)}</div>` : ""}
    ${tier === "crueltyFree" && p.cfNote ? `<div class="prod-cf">${esc(p.cfNote)}</div>` : ""}
  </div>`;
}

function principleBlock(id) {
  const pr = getPrinciple(id);
  if (!pr) return "";
  const steps = pr.steps ? `<ol>${pr.steps.map((s) => `<li>${esc(t(s))}</li>`).join("")}</ol>` : "";
  const options = pr.options
    ? `<p>${esc(t(pr.options.intro))}</p><div class="choices">${pr.options.choices
        .map((ch) => `<div class="choice"><b>${esc(t(ch.label))}</b><p>${esc(t(ch.text))}</p></div>`)
        .join("")}</div>`
    : "";
  const body = pr.body.map((p) => `<p>${esc(t(p))}</p>`).join("");
  return `
  <details class="principle">
    <summary>${esc(t(pr.linkLabel || "Why this works"))}</summary>
    <div class="principle-body"><p>${esc(t(pr.summary))}</p>${steps}${options}${body}</div>
  </details>`;
}

function stepCard(step, index, tier) {
  const products = step.products[tier] || [];
  let productHtml = "";
  if (step.variants) {
    // mutually exclusive options within one step — "pick one", not a checklist
    productHtml =
      `<div class="variants">` +
      step.variants
        .map((v) => {
          const vp = v.products[tier] || [];
          const primary = v.tag === "Start here";
          const inner = vp.length
            ? `<div class="prods">${vp.map((p) => productCard(p, tier)).join("")}</div>`
            : v.emptyText
              ? `<div class="empty">${esc(t(v.emptyText))}</div>`
              : "";
          return `<div class="variant${primary ? " primary" : ""}">
            <div class="variant-head"><b>${esc(t(v.label))}</b>${v.tag ? `<span class="vtag${primary ? " hot" : ""}">${esc(t(v.tag))}</span>` : ""}</div>
            ${v.note ? `<p class="how">${esc(t(v.note))}</p>` : ""}
            ${inner}</div>`;
        })
        .join("") +
      `</div>`;
  } else if (!step.noProducts) {
    productHtml = products.length
      ? `<div class="prods">${products.map((p) => productCard(p, tier)).join("")}</div>`
      : step.emptyText
        ? `<div class="empty">${esc(t(step.emptyText))}</div>`
        : "";
  }
  return `
  <li class="step">
    <div class="step-head">
      <span class="step-num" aria-hidden="true">${index}</span>
      <div>
        <h3>${esc(t(step.title))}</h3>
        ${step.optional ? `<span class="optional">${esc(t("(optional)"))}</span>` : ""}
        ${step.frequency ? `<span class="freq">${esc(t(step.frequency))}</span>` : ""}
        <p class="how">${esc(t(step.how))}</p>
      </div>
    </div>
    ${productHtml}
    ${step.principleId ? principleBlock(step.principleId) : ""}
  </li>`;
}

function renderResults() {
  const r = state.routine;
  const tier = state.tier;
  const tabs = TIER_KEYS.map((key) => {
    const meta = TIER_META[key];
    return `<button class="tab${key === tier ? " active" : ""}" role="tab" aria-selected="${key === tier}" data-action="tier" data-value="${key}">
      <span class="tab-emoji" aria-hidden="true">${meta.emoji}</span> ${esc(t(meta.label))}</button>`;
  }).join("");

  const subtabs = [...r.phases.map((ph) => ({ id: ph.id, title: ph.title, emoji: ph.emoji })), { id: "tips", title: "Tips", emoji: "💡" }]
    .map(
      (pt) => `<button type="button" role="tab" aria-selected="${pt.id === state.phase}" class="subtab${pt.id === state.phase ? " active" : ""}" data-action="phase" data-value="${pt.id}"><span class="tab-emoji" aria-hidden="true">${pt.emoji} </span>${esc(t(pt.title))}</button>`
    )
    .join("");

  const active = r.phases.find((ph) => ph.id === state.phase);
  const phases = active
    ? `
      <section class="phase rise">
        <h2><span aria-hidden="true">${active.emoji}</span> ${esc(t(active.title))}</h2>
        ${active.intro ? `<p class="intro">${esc(t(active.intro))}</p>` : ""}
        <ol class="steps">${active.steps.map((s, i) => stepCard(s, i + 1, tier)).join("")}</ol>
      </section>`
    : `
      <section class="phase rise">
        <h2>${esc(t("💡 Good to know"))}</h2>
        ${r.notes.map((n) => `<div class="note"><h3>${esc(t(n.title))}</h3>${n.body.map((p) => `<p>${esc(t(p))}</p>`).join("")}</div>`).join("")}
      </section>`;

  return `
  <main class="results">
    <div class="col">
      <header class="rise">
        <p class="eyebrow">${esc(t("Your routine is ready ✨"))}</p>
        <h1>${esc(t(r.summary.headline))}</h1>
        <p class="blurb">${esc(t(r.summary.blurb))}</p>
        ${r.summary.also && r.summary.also.length ? `<p class="also">${esc(t("Also folded in:"))} ${r.summary.also.map((a) => esc(t(a))).join(" · ")}</p>` : ""}
        <ul class="chips">${r.summary.chips.map((c) => `<li>${esc(t(c))}</li>`).join("")}</ul>
      </header>
      <div class="tabs-wrap">
        <div class="tabs" role="tablist" aria-label="Product tier">${tabs}</div>
        <div class="subtabs" role="tablist" aria-label="Routine section">${subtabs}</div>
      </div>
      ${tier === "crueltyFree" ? `<p class="cf-note">${esc(t("🐰 Certified or independently tracked cruelty-free — across every price point. Certifications can change; verify via Leaping Bunny or PETA before you buy."))}</p>` : ""}
      ${phases}
      <div class="actions">
        <div class="save-wrap">
          <button class="pill" data-action="unlock" title="${esc(t(PREMIUM.unlockLabel))}">🔒 ${esc(t("Save My Routine"))}</button>
          <span class="soon">🔒 ${esc(t(PREMIUM.unlockLabel))}</span>
        </div>
        <p class="paywall-note${state.unlockClicked ? " hot" : ""}">${esc(t(state.unlockClicked
          ? "This shareable demo can't take payments — on the live site this button opens a secure Stripe checkout (card, Apple Pay, Google Pay) and your routine unlocks right after."
          : "In the full app this opens a secure Stripe checkout (card, Apple Pay, Google Pay) and unlocks routine saving — payments are switched off in this shareable demo."))}</p>
        <button class="pill retake" data-action="retake">${esc(t("Retake Quiz"))}</button>
      </div>
      ${renderSignup()}
      <footer>
        ${esc(t("How Is My Hair gives cosmetic styling guidance, not medical treatment. Persistent scalp issues — anything painful, spreading, or unresponsive to over-the-counter care — deserve a dermatologist visit rather than a routine change."))}
        <br /><br />
        ${esc(t("Live demo — same quiz data & recommendation engine as the How Is My Hair app (v1)."))}
      </footer>
    </div>
  </main>`;
}

let lastViewKey = null;
// Free segmented email signup (spec §12) — demo build: validates and shows
// the success state but doesn't store anything (no backend in the demo).
function renderSignup() {
  if (state.signedUp) {
    return `
    <section class="signup">
      <h2>${esc(t("You're in! 💌"))}</h2>
      <p class="how">${esc(t("We'll only send what you picked — new products, treatments, and deals. Unsubscribe anytime."))}
      <em>${esc(t("(Demo build — signups aren't stored yet.)"))}</em></p>
    </section>`;
  }
  const chips = NEWSLETTER_TIERS.map(
    (tier) => `<button type="button" class="tier-chip${state.signupTiers.includes(tier.value) ? " on" : ""}" aria-pressed="${state.signupTiers.includes(tier.value)}" data-action="signup-tier" data-value="${tier.value}">${esc(t(tier.label))}</button>`
  ).join("");
  const allOn = state.signupTiers.length === NEWSLETTER_TIERS.length;
  return `
  <section class="signup" aria-label="Email signup">
    <h2>${esc(t("Get new products, treatments, and deals sent to you 💌"))}</h2>
    <p class="how">${esc(t("Free, and segmented to what you actually care about — pick one, two, or all three."))}</p>
    <div class="tier-chips">${chips}
      <button type="button" class="tier-chip${allOn ? " on" : ""}" aria-pressed="${allOn}" data-action="signup-all">${esc(t("All three ✨"))}</button>
    </div>
    <div class="signup-fields">
      <input id="signup-email" type="email" placeholder="you@example.com" aria-label="Email address" value="${esc(state.signupEmail || "")}" />
      <input id="signup-zip" type="text" inputmode="numeric" placeholder="${esc(t("ZIP (optional)"))}" aria-label="ZIP code (optional)" value="${esc(state.signupZip || "")}" />
    </div>
    <p class="how" style="font-size:.78rem">${esc(t("ZIP just helps us point you to options in your area — no location tracking."))}</p>
    ${state.signupError ? `<p class="signup-error">${esc(t(state.signupError))}</p>` : ""}
    <button type="button" class="pill signup-btn" data-action="signup-submit">${esc(t("Sign me up"))}</button>
  </section>`;
}

function readSignupFields() {
  const emailEl = document.getElementById("signup-email");
  const zipEl = document.getElementById("signup-zip");
  if (emailEl) state.signupEmail = emailEl.value;
  if (zipEl) state.signupZip = zipEl.value;
}

function render() {
  app.innerHTML =
    state.screen === "landing" ? renderLanding() : state.screen === "quiz" ? renderQuiz() : renderResults();
  // Scroll to top only when the view changes (new screen / next question) —
  // answer taps and tier switches keep the reader's place.
  const viewKey = `${state.screen}:${state.screen === "quiz" ? state.idx : ""}`;
  if (viewKey !== lastViewKey) window.scrollTo(0, 0);
  lastViewKey = viewKey;
}

app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const action = el.dataset.action;

  if (action === "start") {
    state.screen = "quiz";
    state.idx = 0;
    render();
  } else if (action === "pick") {
    const q = QUESTIONS[state.idx];
    const v = el.dataset.value;
    if (q.multiSelect) {
      const current = Array.isArray(state.answers[q.id]) ? state.answers[q.id] : [];
      const opt = q.options.find((o) => o.value === v);
      let next;
      if (opt.exclusive) {
        next = current.includes(v) ? [] : [v];
      } else if (current.includes(v)) {
        next = current.filter((x) => x !== v);
      } else {
        const exclusives = q.options.filter((o) => o.exclusive).map((o) => o.value);
        next = [...current.filter((x) => !exclusives.includes(x)), v];
      }
      state.answers[q.id] = next;
    } else {
      state.answers[q.id] = v;
    }
    render();
  } else if (action === "back") {
    if (state.idx === 0) state.screen = "landing";
    else state.idx -= 1;
    render();
  } else if (action === "next") {
    const q = QUESTIONS[state.idx];
    if (!isAnswered(state.answers, q)) return;
    if (state.idx === QUESTIONS.length - 1) {
      state.routine = buildRoutine(state.answers);
      state.tier = state.routine.defaultTier;
      state.screen = "results";
    } else {
      state.idx += 1;
    }
    render();
  } else if (action === "tier") {
    readSignupFields();
    state.tier = el.dataset.value;
    render();
  } else if (action === "phase") {
    readSignupFields();
    state.phase = el.dataset.value;
    render();
  } else if (action === "signup-tier") {
    readSignupFields();
    const v = el.dataset.value;
    state.signupTiers = state.signupTiers.includes(v)
      ? state.signupTiers.filter((t) => t !== v)
      : [...state.signupTiers, v];
    render();
  } else if (action === "signup-all") {
    readSignupFields();
    state.signupTiers =
      state.signupTiers.length === NEWSLETTER_TIERS.length ? [] : NEWSLETTER_TIERS.map((t) => t.value);
    render();
  } else if (action === "signup-submit") {
    readSignupFields();
    const email = state.signupEmail.trim();
    const zip = state.signupZip.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) state.signupError = "That email doesn't look quite right.";
    else if (state.signupTiers.length === 0) state.signupError = "Pick at least one topic — or grab all three.";
    else if (zip && !/^\d{5}(-\d{4})?$/.test(zip)) state.signupError = "ZIP should be 5 digits (or leave it blank).";
    else {
      state.signupError = "";
      state.signedUp = true;
    }
    render();
  } else if (action === "unlock") {
    // demo can't charge — respond honestly instead of doing nothing
    state.unlockClicked = true;
    render();
  } else if (action === "retake") {
    state.answers = {};
    state.routine = null;
    state.idx = 0;
    state.phase = "washDay";
    state.unlockClicked = false;
    state.screen = "quiz";
    render();
  }
});

render();
</script>
